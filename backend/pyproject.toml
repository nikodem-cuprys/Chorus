[project]
name = "chorus"
version = "0.1.0"
description = "Turns a written work into a multi-voice audio drama"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.4",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "celery[redis]==5.6.3",
    "redis==6.4.0",  # the newest kombu 5.6 allows
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",  # file uploads; the version the GPU constraints pin
    "lxml==6.1.3",
    "pdfplumber==0.11.10",
    "pypdf==6.19.0",
    "lingua-language-detector==2.1.1",
    "charset-normalizer==3.5.1",  # the version the GPU constraints pin
    # Line audio is written as FLAC outside the GPU code too; the versions the GPU stack pins.
    "numpy==1.26.4",
    "soundfile==0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx2==2.13.1",  # what starlette.testclient wants
    "ruff==0.17.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chorus*"]

[tool.setuptools.package-data]
# The Language packs' files.
"chorus.languages" = ["*/*.json", "*/voices/*.json", "*/voices/*.wav", "*/*.txt"]
# The pause settings (chorus.voicing, chapter assembly).
"chorus" = ["pauses.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
